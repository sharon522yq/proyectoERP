name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    name: Backend Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build reproducible backend image
        run: docker build --file backend/Dockerfile --tag erp-ci .
      - name: Check Express startup without database access
        run: docker run --rm --entrypoint node erp-ci -e "require('./src/app').createApp()"

  frontend-cloudflare:
    name: Frontend / Cloudflare readiness
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://proyectoerp-api.onrender.com/api/v1

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Export Expo web app
        working-directory: frontend
        run: npm run export:web

      - name: Validate Cloudflare deployment inputs
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/_headers
          test -f frontend/dist/_redirects
          test -f frontend/wrangler.jsonc
          node -e "JSON.parse(require('fs').readFileSync('frontend/wrangler.jsonc', 'utf8'))"
          npm --prefix frontend run verify:web

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm test

      - name: Build check
        working-directory: backend
        run: node -e "require('./src/app').createApp()"
